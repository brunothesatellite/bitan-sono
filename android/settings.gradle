/* ==========================================================================
   bitan·sono — coquille Android (WebView + USB host natif)
   --------------------------------------------------------------------------
   L'application ne dépend d'aucune bibliothèque : uniquement le framework
   Android. La webapp de ./mobile est embarquée telle quelle dans l'APK au
   moment de la compilation (voir app/build.gradle, tâche `copyWebapp`).
   ========================================================================== */

pluginManagement {
    plugins {
        id "com.android.application" version "9.4.1"
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "bitan-sono"
include ":app"
